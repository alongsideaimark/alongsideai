<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" aria-label="Lantern Plan mark">
  <!-- sage rounded square (matches current brand language) -->
  <rect x="0" y="0" width="120" height="140" rx="18" fill="#7B9E87"/>

  <!-- handle: small semicircle arc at top -->
  <path d="M 50 30 Q 60 16 70 30" stroke="#FAF6F1" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- top cap -->
  <rect x="40" y="32" width="40" height="6" rx="2" fill="#FAF6F1"/>

  <!-- lantern body (frame outline) -->
  <rect x="34" y="44" width="52" height="60" rx="4" stroke="#FAF6F1" stroke-width="3" fill="none"/>

  <!-- glowing light -->
  <circle cx="60" cy="74" r="11" fill="#D4A853"/>

  <!-- bottom base -->
  <rect x="40" y="106" width="40" height="6" rx="2" fill="#FAF6F1"/>
</svg>
