[build]
  command = "npm test"
  publish = "."

# The old domain still points at this site — permanently redirect every page
# to lanternplan.com so search engines and old links converge on one domain.
[[redirects]]
  from = "https://alongsideai.ai/*"
  to = "https://lanternplan.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alongsideai.ai/*"
  to = "https://lanternplan.com/:splat"
  status = 301
  force = true

# Internal files — the repo root is the publish directory, so anything not
# blocked here is publicly downloadable. These paths are the business's
# internals (the AI prompt, ops docs, scripts) and must never be served.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/eval/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/brand-explorations/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/refund-policy.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Stripe Checkout: pretty URL so the pricing page can POST to /api/create-checkout
[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

# Token validation: questionnaire checks payment tokens here
[[redirects]]
  from = "/api/validate-token"
  to = "/.netlify/functions/validate-token"
  status = 200

# Stripe webhook: pretty URL for the Stripe dashboard endpoint config
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Customer revision page: /revise/TOKEN serves the static HTML page.
# The page itself calls the validation + revision functions via fetch.
[[redirects]]
  from = "/revise/*"
  to = "/revise/index.html"
  status = 200

# Pretty URL for plan previews: /plans/abc123 serves the rendered draft.
# Uses a splat (*) rather than :id because Netlify doesn't always interpolate
# named placeholders into the query string portion of the "to" URL.
[[redirects]]
  from = "/plans/*"
  to = "/.netlify/functions/view-plan?id=:splat"
  status = 200

# The plan-drafting function reads the HTML template, the prompt, and the two
# sample plans at runtime. Tell Netlify's function bundler to ship those files
# with the function — otherwise they'd be missing and the function would crash.
[functions."generate-plan-background"]
  included_files = [
    "netlify/plan-template/template.html",
    "netlify/plan-template/prompt.md",
    "netlify/lib/reference-plans/gold-standard.html",
    "netlify/lib/reference-plans/semi-retired.html",
    "assets/plan.css"
  ]

[functions."view-plan"]
  included_files = [
    "netlify/plan-template/template.html",
    "assets/plan.css"
  ]

[functions."revise-plan-background"]
  included_files = [
    "netlify/plan-template/template.html",
    "netlify/plan-template/prompt.md",
    "netlify/lib/reference-plans/gold-standard.html",
    "netlify/lib/reference-plans/semi-retired.html",
    "assets/plan.css"
  ]

[functions."retry-plan-background"]
  included_files = [
    "netlify/plan-template/template.html",
    "netlify/plan-template/prompt.md",
    "netlify/lib/reference-plans/gold-standard.html",
    "netlify/lib/reference-plans/semi-retired.html",
    "assets/plan.css"
  ]

[functions."revise-plan-customer-background"]
  included_files = [
    "netlify/plan-template/template.html",
    "netlify/plan-template/prompt.md",
    "netlify/lib/reference-plans/gold-standard.html",
    "netlify/lib/reference-plans/semi-retired.html",
    "assets/plan.css"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Pretty URLs: /legal, /guides, /questionnaire all work with or without trailing slash
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true
